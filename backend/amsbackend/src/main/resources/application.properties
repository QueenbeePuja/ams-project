spring.application.name=amsbackend

server.address=0.0.0.0
server.port=8081
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ams_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# Set JWT_SECRET to a random base64 string (see README)
ams.jwt.secret=${JWT_SECRET}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
ams.semester.end-date=2026-12-15

