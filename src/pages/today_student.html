<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/output.css" />
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <title>Home</title>
    <script>
      const role = localStorage.getItem("role")?.toUpperCase();

      if (!role) {
        window.location.href = "http://127.0.0.1:5500/src/pages/login.html";
      }

      if (role !== "STUDENT") {
        window.location.href = "http://127.0.0.1:5500/src/pages/login.html";
      }
    </script>
  </head>
  <body class="m-0 bg-[#fefae0]">
    <div class="flex flex-col min-h-screen">
      <!-- ✅ FULL WIDTH NAVBAR -->
      <div id="navbar"></div>

      <!-- ✅ SIDEBAR + CONTENT -->
      <div class="flex flex-1 relative">
        <!-- SIDEBAR -->
        <div id="sidebar"></div>

        <!-- MAIN CONTENT -->
        <div class="main-body-content flex-1 bg-[#fefae0] p-4">
          <div class="flex flex-col gap-6">
            <!-- TIME TABLE -->
            <div class="bg-white p-6 shadow rounded">
              <h2
                class="text-lg font-semibold text-gray-700 mb-4 tracking-wide"
              >
                TIME TABLE
              </h2>
              <div
                id="timetableContainer"
                class="space-y-3 max-h-64 md:max-h-80 overflow-y-auto"
              ></div>
            </div>

            <!-- QR SCANNER -->
            <div
              id="scannerSection"
              class="hidden bg-white p-6 rounded-2xl shadow-md text-center"
            >
              <h2 class="text-lg font-semibold mb-4">Scan Attendance QR</h2>

              <div id="reader" class="w-full max-w-xs mx-auto"></div>

              <div
                id="scanResult"
                class="mt-4 text-green-600 font-semibold"
              ></div>
            </div>

            <!-- TEACHER MESSAGE + ANNOUNCEMENTS -->
            <div class="flex gap-6 flex-wrap">
              <!-- Teacher Message -->
              <div
                class="w-full max-[900px]:w-full min-[901px]:w-[48%] bg-white p-6 rounded-2xl shadow-md"
              >
                <h2 class="text-lg font-semibold text-gray-700 mb-4">
                  Teacher Message
                </h2>

                <div class="space-y-3">
                  <div
                    class="p-6 bg-gray-100 rounded-lg text-center text-gray-500 text-sm"
                  >
                    <div class="text-lg">📭</div>
                    <div>No new messages</div>
                    <div class="text-xs mt-1">
                      Check back later for updates from your instructors.
                    </div>
                  </div>
                </div>
              </div>

              <!-- Announcements -->
              <div
                class="w-full max-[900px]:w-full min-[901px]:w-[48%] bg-white p-6 rounded-2xl shadow-md"
              >
                <h2 class="text-lg font-semibold text-gray-700 mb-4">
                  Announcements
                </h2>
                <ul
                  id="announcementList"
                  class="space-y-3 max-h-72 overflow-y-auto"
                ></ul>
                <p id="announcementEmpty" class="text-sm text-gray-500 hidden">
                  No announcements yet.
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      feather.replace();
    </script>
    <script src="../js/layout.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/announcements.js"></script>
    <script src="../js/today_student.js"></script>

    <!-- OVERLAY -->
    <div
      id="overlay"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.1);
        display: none;
        z-index: 40;
      "
    ></div>
  </body>
</html>
