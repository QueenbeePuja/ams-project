<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/output.css" />
    <script src="https://unpkg.com/feather-icons"></script>
    <title>Dashboard</title>

    <script>
      (function () {
        var role = (localStorage.getItem("role") || "").toUpperCase();
        if (role !== "ADMIN") {
          window.location.href = "login.html";
        }
      })();
    </script>
  </head>

  <body class="m-0 bg-[#fefae0]">
    <div class="flex flex-col min-h-screen">
      <!-- ✅ NAVBAR FULL WIDTH -->
      <div id="navbar"></div>

      <!-- ✅ SIDEBAR + CONTENT -->
      <div class="flex flex-1 relative">
        <!-- SIDEBAR -->
        <div id="sidebar"></div>

        <!-- MAIN CONTENT -->
        <div class="main-body-content flex-1 min-w-0 bg-[#fefae0] p-4">
          <div class="flex flex-col gap-6">
            <!-- DASHBOARD CONTENT: we build this one block at a time -->
            <div class="bg-white p-6 shadow rounded">
              <h2 class="text-lg font-semibold text-gray-700 tracking-wide">
                DASHBOARD
              </h2>
              <p class="text-sm text-gray-500 mt-2">Content coming soon.</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      feather.replace();
    </script>
    <script src="../js/common.js"></script>
    <script src="../js/layout.js"></script>
    <!-- page script goes here when we add content, e.g.
    <script src="../js/dashboard_student.js"></script> -->

    <!-- ✅ OVERLAY (REQUIRED FOR MOBILE SIDEBAR) -->
    <div
      id="overlay"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.1);
        display: none;
        z-index: 40;
      "
    ></div>
  </body>
</html>
