<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/output.css" />
    <script src="https://unpkg.com/feather-icons"></script>
    <title>Dashboard</title>

    <script>
      (function () {
        var role = (localStorage.getItem("role") || "").toUpperCase();
        if (role !== "FACULTY") {
          window.location.href = "login.html";
        }
      })();
    </script>
  </head>

  <body class="m-0 bg-[#fefae0]">
    <div class="flex flex-col min-h-screen">
      <!-- ✅ NAVBAR FULL WIDTH -->
      <div id="navbar"></div>

      <!-- ✅ SIDEBAR + CONTENT -->
      <div class="flex flex-1 relative">
        <!-- SIDEBAR -->
        <div id="sidebar"></div>

        <!-- MAIN CONTENT -->
        <div class="main-body-content flex-1 min-w-0 bg-[#fefae0] p-4">
          <div class="flex flex-col gap-6">
            <!-- DASHBOARD CONTENT: we build this one block at a time -->
            <div class="space-y-4">
              <div
                class="bg-white rounded-xl shadow p-4 flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4"
              >
                <label
                  for="subjectFilter"
                  class="text-xs font-semibold tracking-wide text-gray-500"
                  >VIEW ANALYTICS FOR</label
                >
                <select
                  id="subjectFilter"
                  class="border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white w-full sm:w-auto sm:min-w-[260px] focus:outline-none focus:ring-2 focus:ring-[#606c38]"
                >
                  <option value="all">All my subjects</option>
                </select>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
                <div class="bg-white rounded-xl shadow p-4">
                  <p class="text-xs font-semibold tracking-wide text-gray-500">
                    SUBJECTS YOU TEACH
                  </p>
                  <p
                    id="statSubjects"
                    class="text-4xl font-bold text-[#283618] mt-2"
                  >
                    --
                  </p>
                  <p
                    id="statSubjectsSub"
                    class="text-sm text-gray-500 mt-2"
                  ></p>
                </div>

                <div class="bg-white rounded-xl shadow p-4">
                  <p class="text-xs font-semibold tracking-wide text-gray-500">
                    AVERAGE ATTENDANCE
                  </p>
                  <p
                    id="statAvg"
                    class="text-4xl font-bold text-[#283618] mt-2"
                  >
                    --%
                  </p>
                  <p class="text-sm text-gray-500 mt-2">across your subjects</p>
                </div>

                <div class="bg-white rounded-xl shadow p-4">
                  <p class="text-xs font-semibold tracking-wide text-gray-500">
                    BELOW THRESHOLD
                  </p>
                  <p
                    id="statLow"
                    class="text-4xl font-bold text-[#bc4749] mt-2"
                  >
                    --
                  </p>
                  <p id="statLowSub" class="text-sm text-gray-500 mt-2"></p>
                </div>

                <div class="bg-white rounded-xl shadow p-4">
                  <p class="text-xs font-semibold tracking-wide text-gray-500">
                    NEEDS MOST ATTENTION
                  </p>
                  <p
                    id="statWorst"
                    class="text-xl font-bold text-[#283618] mt-3"
                  >
                    --
                  </p>
                  <p id="statWorstSub" class="text-sm text-gray-500 mt-2"></p>
                </div>
              </div>

              <div class="bg-white rounded-xl shadow p-4">
                <p
                  class="text-xs font-semibold tracking-wide text-gray-500 mb-3"
                >
                  AVERAGE ATTENDANCE BY SUBJECT
                </p>
                <div class="relative h-72 w-full">
                  <canvas id="facultyChart"></canvas>
                </div>
              </div>

              <div>
                <p
                  class="text-xs font-semibold tracking-wide text-gray-500 mb-3"
                >
                  STUDENTS BELOW THRESHOLD
                </p>
                <div
                  id="lowLists"
                  class="grid grid-cols-1 lg:grid-cols-2 gap-4"
                ></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      feather.replace();
    </script>
    <script src="../js/common.js"></script>
    <script src="../js/layout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="../js/dashboard_faculty.js"></script>
    <!-- page script goes here when we add content, e.g.
    <script src="../js/dashboard_student.js"></script> -->

    <!-- ✅ OVERLAY (REQUIRED FOR MOBILE SIDEBAR) -->
    <div
      id="overlay"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.1);
        display: none;
        z-index: 40;
      "
    ></div>
  </body>
</html>
