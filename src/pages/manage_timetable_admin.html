<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/output.css" />
    <script src="https://unpkg.com/feather-icons"></script>
    <title>Timetable</title>
  </head>

  <body class="m-0 bg-[#fefae0]">
    <div class="flex flex-col min-h-screen">
      <!-- NAVBAR -->
      <div id="navbar"></div>

      <!-- SIDEBAR + CONTENT -->
      <div class="flex flex-1 relative">
        <!-- SIDEBAR -->
        <div id="sidebar"></div>

        <!-- MAIN CONTENT -->
        <div class="main-body-content flex-1 bg-[#fefae0] p-4 overflow-y-auto">
          <div class="flex flex-col gap-6">
            <div class="bg-white p-6 rounded-2xl shadow-md">
              <!-- HEADER -->
              <div
                class="flex flex-col md:flex-row md:justify-between md:items-center gap-3"
              >
                <h2 class="text-gray-700 text-xl font-semibold">
                  Create Timetable
                </h2>

                <select
                  id="semester-select"
                  class="border rounded-lg p-2 w-full md:w-auto"
                >
                  <option value="">Choose Semester</option>
                  <option value="1">Semester 1</option>
                  <option value="2">Semester 2</option>
                  <option value="3">Semester 3</option>
                  <option value="4">Semester 4</option>
                  <option value="5">Semester 5</option>
                  <option value="6">Semester 6</option>
                </select>
              </div>

              <!-- TABLE -->
              <div class="overflow-x-auto mt-6">
                <table
                  class="w-full border border-gray-300 text-sm text-center border-collapse min-w-[600px]"
                >
                  <thead id="timetable-head"></thead>
                  <tbody id="timetable-body"></tbody>
                </table>
              </div>

              <!-- ACTION BUTTONS -->
              <div class="flex flex-col sm:flex-row justify-end gap-3 mt-4">
                <button
                  id="reset-timetable"
                  class="px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 w-full sm:w-auto"
                >
                  Reset
                </button>

                <button
                  id="save-timetable"
                  class="px-4 py-2 bg-green-700 text-white rounded-lg hover:bg-green-800 w-full sm:w-auto"
                >
                  Save Timetable
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      feather.replace();
    </script>

    <script src="../js/layout.js"></script>
    <script src="../js/manage_timetable_admin.js"></script>
    <script src="../js/common.js"></script>

    <!-- OVERLAY -->
    <div
      id="overlay"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.1);
        display: none;
        z-index: 40;
      "
    ></div>
  </body>
</html>
