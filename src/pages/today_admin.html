<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/output.css" />
    <script src="https://unpkg.com/feather-icons"></script>
    <title>Home</title>
    <script>
      const role = localStorage.getItem("role");

      if (!role) {
        window.location.href = "http://127.0.0.1:5500/src/pages/login.html";
      }

      if (role !== "Admin") {
        window.location.href = "http://127.0.0.1:5500/src/pages/login.html";
      }
    </script>
  </head>

  <body>
    <div class="main-page flex h-screen">
      <div id="sidebar"></div>

      <div class="right-page flex flex-col flex-1">
        <div id="navbar"></div>
        <!-- Main body content where all the backend work will appear -->
        <div class="main-body-content flex-1 bg-[#fefae0] p-10">
          <!-- Holds ADMIN Cards -->
          <div class="grid gap-6">
            <div class="grid grid-cols-3 gap-6">
              <!-- classes completed count-->
              <div
                class="bg-white p-6 rounded-2xl shadow-md hover:shadow-lg transition"
              >
                <h3 class="text-sm text-gray-500">Classes Today</h3>

                <div class="text-3xl font-bold mt-2">4 / 8</div>

                <p class="text-sm text-gray-500 mt-1">Completed</p>
              </div>
              <!-- classes Pending count-->
              <div
                class="bg-white p-6 rounded-2xl shadow-md hover:shadow-lg transition"
              >
                <h3 class="text-sm text-gray-500">Attendance Pending</h3>

                <div class="text-3xl font-bold mt-2">4</div>

                <p class="text-sm text-gray-500 mt-1">Classes remaining</p>
              </div>
              <!-- anouncement count-->
              <div
                class="bg-white p-6 rounded-2xl shadow-md hover:shadow-lg transition"
              >
                <h3 class="text-sm text-gray-500">Announcements Today</h3>

                <div class="text-3xl font-bold mt-2">2</div>

                <p class="text-sm text-gray-500 mt-1">Posted today</p>
              </div>
            </div>
            <!-- anouncement related elements-->
            <div class="grid grid-cols-2 gap-6">
              <!--grid 1-->
              <div
                class="bg-white p-6 rounded-2xl shadow-md hover:shadow-lg transition"
              >
                <h2 class="text-lg font-semibold text-gray-700 mb-4">
                  Post Announcement
                </h2>

                <select class="w-full border rounded-lg p-2 mb-3">
                  <option value="">Select Audience</option>
                  <option value="faculty">Faculty</option>
                  <option value="students">Students</option>
                  <option value="both">Both</option>
                </select>

                <input
                  type="text"
                  placeholder="Announcement Title"
                  class="w-full border rounded-lg p-2 mb-3"
                />

                <textarea
                  class="w-full border rounded-lg p-3 h-24"
                  placeholder="Write announcement..."
                ></textarea>

                <button
                  class="mt-3 bg-[#283618] hover:bg-[#606c38] transition text-white px-4 py-2 rounded-lg"
                >
                  Post Announcement
                </button>
              </div>
              <!--grid 2-->
              <div
                class="bg-white p-6 rounded-2xl shadow-md hover:shadow-lg transition"
              >
                <h2 class="text-lg font-semibold text-gray-700 mb-4">
                  Recent Announcements
                </h2>

                <ul class="space-y-3 text-gray-700 max-h-64 overflow-y-auto">
                  <li class="flex items-start gap-2">
                    <span>📢</span>
                    <span>Faculty meeting scheduled for Friday.</span>
                  </li>

                  <li class="flex items-start gap-2">
                    <span>📢</span>
                    <span>Submit internal marks before 25 March.</span>
                  </li>

                  <li class="flex items-start gap-2">
                    <span>📢</span>
                    <span>Workshop on AI next week.</span>
                  </li>
                </ul>
              </div>
            </div>
          </div>
          <!--end of ADMIN cards -->
        </div>
      </div>
    </div>
    <script>
      feather.replace();
    </script>
    <script src="../js/layout.js"></script>
    <script src="/src/js/common.js"></script>
  </body>
</html>
