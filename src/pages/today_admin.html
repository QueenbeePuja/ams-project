<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/output.css" />
    <script src="https://unpkg.com/feather-icons"></script>
    <title>Home</title>

    <script>
      (function () {
        var role = (localStorage.getItem("role") || "").toUpperCase();
        if (role !== "ADMIN") {
          window.location.href = "login.html";
        }
      })();
    </script>
  </head>

  <body class="m-0 bg-[#fefae0]">
    <div class="flex flex-col min-h-screen">
      <!-- NAVBAR -->
      <div id="navbar"></div>

      <!-- SIDEBAR + CONTENT -->
      <div class="flex flex-1 relative">
        <div id="sidebar"></div>

        <!-- MAIN CONTENT -->
        <div class="main-body-content flex-1 min-w-0 bg-[#fefae0] p-4">
          <div class="flex flex-col gap-6">
            <!-- STATS CARDS -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div class="bg-white p-6 rounded-2xl shadow-md">
                <h3 class="text-sm text-gray-500">Attendance Taken</h3>
                <div id="statTaken" class="text-3xl font-bold mt-2">
                  -- / --
                </div>
                <p class="text-sm text-gray-500 mt-1">
                  sessions started / classes today
                </p>
              </div>

              <div class="bg-white p-6 rounded-2xl shadow-md">
                <h3 class="text-sm text-gray-500">Attendance Pending</h3>
                <div id="statPending" class="text-3xl font-bold mt-2">--</div>
                <p class="text-sm text-gray-500 mt-1">
                  classes with no session yet
                </p>
              </div>

              <div class="bg-white p-6 rounded-2xl shadow-md">
                <h3 class="text-sm text-gray-500">Announcements Today</h3>
                <div id="statAnnounce" class="text-3xl font-bold mt-2">--</div>
                <p class="text-sm text-gray-500 mt-1">posted today</p>
              </div>
            </div>

            <!-- LOWER SECTION -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <!-- POST ANNOUNCEMENT -->
              <div class="bg-white p-6 rounded-2xl shadow-md">
                <h2 class="text-lg font-semibold text-gray-700 mb-4">
                  Post Announcement
                </h2>

                <select
                  id="annAudience"
                  class="w-full border rounded-lg p-2 mb-3"
                >
                  <option value="">Select Audience</option>
                  <option value="faculty">Faculty</option>
                  <option value="students">Students</option>
                  <option value="both">Both</option>
                </select>

                <input
                  id="annTitle"
                  type="text"
                  maxlength="150"
                  placeholder="Announcement Title"
                  class="w-full border rounded-lg p-2 mb-3"
                />

                <textarea
                  id="annMessage"
                  maxlength="2000"
                  class="w-full border rounded-lg p-3 h-24"
                  placeholder="Write announcement..."
                ></textarea>

                <button
                  id="annPost"
                  class="mt-3 bg-[#283618] hover:bg-[#606c38] transition text-white px-4 py-2 rounded-lg"
                >
                  Post Announcement
                </button>
                <p id="annMsg" class="text-sm mt-2"></p>
              </div>

              <!-- RECENT ANNOUNCEMENTS -->
              <div class="bg-white p-6 rounded-2xl shadow-md">
                <h2 class="text-lg font-semibold text-gray-700 mb-4">
                  Recent Announcements
                </h2>

                <ul
                  id="annList"
                  class="space-y-3 text-gray-700 max-h-96 overflow-y-auto"
                ></ul>
                <p id="annEmpty" class="text-sm text-gray-500 hidden">
                  No announcements yet.
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      feather.replace();
    </script>

    <script src="../js/common.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/today_admin.js"></script>

    <!-- OVERLAY -->
    <div
      id="overlay"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.1);
        display: none;
        z-index: 40;
      "
    ></div>
  </body>
</html>
