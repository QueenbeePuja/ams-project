<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/output.css" />
    <script src="https://unpkg.com/feather-icons"></script>
    <title>Dashboard</title>
    <script src="../js/common.js"></script>
  </head>

  <body class="m-0 bg-[#fefae0]">
    <script>
      checkAuth("Student");
    </script>

    <div class="flex flex-col min-h-screen">
      <!-- NAVBAR -->
      <div id="navbar"></div>

      <!-- SIDEBAR + CONTENT -->
      <div class="flex flex-1 relative">
        <!-- SIDEBAR -->
        <div id="sidebar"></div>

        <!-- MAIN CONTENT -->
        <div class="main-body-content flex-1 bg-[#fefae0] p-6 overflow-y-auto">
          <div class="flex flex-col gap-6">
            <!-- TOP CARDS -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <!-- OVERALL ATTENDANCE -->
              <div
                class="bg-white p-6 rounded-2xl shadow-md hover:shadow-lg transition"
              >
                <h3 class="text-sm text-gray-500">Overall Attendance</h3>

                <div
                  id="overallPercent"
                  class="text-4xl font-bold mt-2 text-[#283618]"
                >
                  --
                </div>

                <p id="overallBuffer" class="text-sm mt-2 font-semibold">
                  Calculating...
                </p>
              </div>

              <!-- CLASSES ATTENDED -->
              <div
                class="bg-white p-6 rounded-2xl shadow-md hover:shadow-lg transition"
              >
                <h3 class="text-sm text-gray-500">Classes Attended</h3>

                <div class="text-4xl font-bold mt-2 text-[#283618]">
                  84 / 102
                </div>

                <p class="text-sm text-gray-500 mt-1">This semester</p>
              </div>
            </div>

            <!-- SUBJECT SAFETY -->
            <div class="bg-white p-6 rounded-2xl shadow-md">
              <h2 class="text-lg font-semibold text-gray-700 mb-4">
                Attendance Safety (Subject-wise)
              </h2>

              <div id="subjectBufferList" class="space-y-3">
                <!-- dynamic -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      feather.replace();
    </script>

    <script src="../js/layout.js"></script>
    <script src="../js/dashboard_student.js"></script>

    <!-- OVERLAY -->
    <div
      id="overlay"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.1);
        display: none;
        z-index: 40;
      "
    ></div>
  </body>
</html>
