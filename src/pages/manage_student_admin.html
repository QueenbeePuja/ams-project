<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/output.css" />
    <script src="https://unpkg.com/feather-icons"></script>
    <title>Dashboard</title>
  </head>

  <body>
    <div class="main-page flex h-screen">
      <div id="sidebar"></div>

      <div class="right-page flex flex-col flex-1 h-full">
        <div id="navbar"></div>
        <!-- Main body content where all the backend work will appear -->
        <div class="main-body-content flex-1 bg-[#fefae0] p-10 overflow-y-auto">
          <div class="grid gap-6">
            <!-- MANAGE STUDENTS -->
            <div class="bg-white p-6 rounded-2xl shadow-md">
              <!-- Header -->
              <div class="flex justify-between items-center">
                <h2 class="text-xl font-semibold text-gray-700">
                  Manage Students
                </h2>

                <button
                  onclick="toggleForm()"
                  class="bg-[#283618] text-white px-4 py-2 rounded-lg hover:bg-[#606c38]"
                >
                  Add Students
                </button>
              </div>

              <!-- Batch Admission Form -->
              <div id="batchForm" class="hidden mt-6">
                <h3 class="text-lg font-semibold text-gray-700 mb-4">
                  Batch Admission
                </h3>

                <div class="grid grid-cols-3 gap-4">
                  <div>
                    <label class="text-sm text-gray-600">
                      Number of Students
                    </label>
                    <input
                      id="studentCount"
                      type="number"
                      class="border rounded-lg p-2 w-full"
                      placeholder="e.g. 110"
                    />
                  </div>

                  <div>
                    <label class="text-sm text-gray-600"> Semester </label>
                    <select class="border rounded-lg p-2 w-full">
                      <option selected>1</option>
                      <option selected>2</option>
                      <option selected>3</option>
                      <option selected>4</option>
                    </select>
                  </div>

                  <div>
                    <label class="text-sm text-gray-600">
                      Admission Year
                    </label>
                    <input
                      type="number"
                      class="border rounded-lg p-2 w-full"
                      placeholder="2025"
                    />
                  </div>
                </div>

                <button
                  onclick="generateStudents()"
                  class="mt-4 bg-[#283618] text-white px-4 py-2 rounded-lg hover:bg-[#606c38]"
                >
                  Generate Fields
                </button>
              </div>
            </div>

            <!-- GENERATED STUDENTS TABLE -->
            <div
              id="studentsTableContainer"
              class="hidden bg-white p-6 rounded-2xl shadow-md max-h-[500px] overflow-y-auto"
            >
              <h3 class="text-lg font-semibold text-gray-700 mb-4">
                Enter Student Details
              </h3>

              <table class="w-full text-left">
                <thead>
                  <tr class="border-b text-gray-600 text-sm">
                    <th class="py-3">Reg No</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Semester</th>
                  </tr>
                </thead>

                <tbody id="studentsTable"></tbody>
              </table>
              <!-- Submit Button -->
              <div class="mt-6 flex justify-end">
                <button
                  onclick="submitStudents()"
                  class="bg-[#283618] text-white px-5 py-2 rounded-lg hover:bg-[#606c38]"
                >
                  Submit Students
                </button>
              </div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-md">
              <div class="flex justify-between items-center mb-4">
                <!-- Search -->
                <input
                  type="text"
                  placeholder="Search student..."
                  class="border rounded-lg p-2 w-80"
                />

                <!-- Filter -->
                <select class="border rounded-lg p-2">
                  <option>All Semesters</option>
                  <option>Semester 1</option>
                  <option>Semester 2</option>
                  <option>Semester 3</option>
                  <option>Semester 4</option>
                  <option>Semester 5</option>
                  <option>Semester 6</option>
                </select>
              </div>
            </div>
            <!--end of search bar-->
            <!--student table-->
            <div class="bg-white p-6 rounded-2xl shadow-md">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b text-gray-600 text-sm">
                    <th class="py-3">Reg No</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Semester</th>
                    <th>Actions</th>
                  </tr>
                </thead>

                <tbody class="text-gray-700">
                  <tr class="border-b hover:bg-gray-50">
                    <td class="py-3">24223070</td>
                    <td>Puja</td>
                    <td>puja@college.edu</td>
                    <td>3</td>

                    <td class="flex gap-3 py-3">
                      <button class="text-blue-600 hover:underline">
                        Edit
                      </button>
                      <button class="text-red-600 hover:underline">
                        Delete
                      </button>
                    </td>
                  </tr>

                  <tr class="border-b hover:bg-gray-50">
                    <td class="py-3">24223071</td>
                    <td>Ravi</td>
                    <td>ravi@college.edu</td>
                    <td>3</td>

                    <td class="space-x-3">
                      <button class="text-blue-600 hover:underline">
                        Edit
                      </button>
                      <button class="text-red-600 hover:underline">
                        Delete
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <!--end of student table-->
          </div>
          <!--end of grid div-->
        </div>
        <!--end of main body -->
      </div>
    </div>
    <script>
      feather.replace();
    </script>
    <script src="../js/layout.js"></script>
    <script src="../js/manage_student_admin.js"></script>
    <script src="/src/js/common.js"></script>
  </body>
</html>
