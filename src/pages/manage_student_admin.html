<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/output.css" />
    <script src="https://unpkg.com/feather-icons"></script>
    <title>Manage Students</title>
  </head>

  <body class="m-0 bg-[#fefae0]">
    <div class="flex flex-col min-h-screen">
      <!-- NAVBAR -->
      <div id="navbar"></div>

      <!-- SIDEBAR + CONTENT -->
      <div class="flex flex-1 relative">
        <!-- SIDEBAR -->
        <div id="sidebar"></div>

        <!-- MAIN CONTENT -->
        <div class="main-body-content flex-1 bg-[#fefae0] p-4 overflow-y-auto">
          <div class="flex flex-col gap-6">
            <!-- MANAGE STUDENTS -->
            <div class="bg-white p-4 rounded-2xl shadow-md">
              <div class="flex justify-between items-center">
                <h2 class="text-xl font-semibold text-gray-700">
                  Manage Students
                </h2>

                <button
                  onclick="toggleForm()"
                  class="inline-block bg-[#283618] text-white px-4 py-2 rounded-lg text-sm hover:bg-[#606c38] transition"
                >
                  Add Students
                </button>
              </div>

              <!-- BATCH FORM -->
              <div id="batchForm" class="hidden mt-6">
                <h3 class="text-lg font-semibold text-gray-700 mb-4">
                  Batch Admission
                </h3>

                <div class="flex items-end gap-4">
                  <!-- INPUTS -->
                  <div class="grid grid-cols-3 gap-4 flex-1">
                    <div>
                      <label class="text-sm text-gray-600">
                        Number of Students
                      </label>
                      <input
                        id="studentCount"
                        type="number"
                        class="border rounded-lg px-3 py-1.5 w-full text-sm"
                        placeholder="e.g. 110"
                      />
                    </div>

                    <div>
                      <label class="text-sm text-gray-600">Semester</label>
                      <select
                        class="border rounded-lg px-3 py-1.5 w-full text-sm"
                      >
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                      </select>
                    </div>

                    <div>
                      <label class="text-sm text-gray-600">
                        Admission Year
                      </label>
                      <input
                        type="number"
                        class="border rounded-lg px-3 py-1.5 w-full text-sm"
                        placeholder="2025"
                      />
                    </div>
                  </div>

                  <!-- BUTTON -->
                  <button
                    onclick="generateStudents()"
                    class="bg-[#283618] text-white px-4 py-2 rounded-lg text-sm hover:bg-[#606c38] transition h-10.5"
                  >
                    Generate Fields
                  </button>
                </div>
              </div>
            </div>

            <!-- GENERATED TABLE -->
            <div
              id="studentsTableContainer"
              class="hidden bg-white p-4 rounded-2xl shadow-md max-h-[500px] overflow-y-auto"
            >
              <h3 class="text-lg font-semibold text-gray-700 mb-4">
                Enter Student Details
              </h3>

              <table class="w-full text-left">
                <thead>
                  <tr class="border-b text-gray-600 text-sm">
                    <th class="py-3">Reg No</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Semester</th>
                  </tr>
                </thead>

                <tbody id="studentsTable"></tbody>
              </table>

              <div class="mt-6 flex justify-end">
                <button
                  onclick="submitStudents()"
                  class="bg-[#283618] text-white px-5 py-2 rounded-lg hover:bg-[#606c38]"
                >
                  Submit Students
                </button>
              </div>
            </div>

            <!-- SEARCH + FILTER -->
            <div class="bg-white p-4 rounded-2xl shadow-md">
              <div class="flex flex-col md:flex-row gap-4 md:justify-between">
                <input
                  type="text"
                  placeholder="Search student..."
                  class="border rounded-lg p-2 w-full md:w-80"
                />

                <select class="border rounded-lg p-2 w-full md:w-auto">
                  <option>All Semesters</option>
                  <option>Semester 1</option>
                  <option>Semester 2</option>
                  <option>Semester 3</option>
                  <option>Semester 4</option>
                  <option>Semester 5</option>
                  <option>Semester 6</option>
                </select>
              </div>
            </div>

            <!-- STUDENT TABLE -->
            <div class="bg-white p-4 rounded-2xl shadow-md overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b text-gray-600 text-sm">
                    <th class="py-3">Reg No</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Semester</th>
                    <th>Actions</th>
                  </tr>
                </thead>

                <tbody id="studentTableBody" class="text-gray-700"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      feather.replace();
    </script>

    <script src="../js/layout.js"></script>
    <script src="../js/manage_student_admin.js"></script>
    <script src="../js/common.js"></script>

    <!-- OVERLAY -->
    <div
      id="overlay"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.1);
        display: none;
        z-index: 40;
      "
    ></div>
  </body>
</html>
