<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/output.css" />
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <title>ATTENDANCE</title>
  </head>

  <body class="m-0 bg-[#fefae0]">
    <div class="flex flex-col min-h-screen">
      <!-- ✅ NAVBAR -->
      <div id="navbar"></div>

      <!-- ✅ SIDEBAR + CONTENT -->
      <div class="flex flex-1 relative">
        <!-- SIDEBAR -->
        <div id="sidebar"></div>

        <!-- MAIN CONTENT -->
        <div class="main-body-content flex-1 bg-[#fefae0] p-4 overflow-y-auto">
          <div class="flex flex-col gap-6 max-w-4xl mx-auto">
            <!-- ATTENDANCE SETUP -->
            <div class="bg-white p-6 rounded-2xl shadow-md">
              <h2 class="text-lg font-semibold text-gray-700 mb-4">
                Start Attendance
              </h2>

              <!-- ✅ RESPONSIVE GRID -->
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- COURSE -->
                <select class="border rounded-lg p-2">
                  <option>Select Course</option>
                  <option>CS501 - Data Mining</option>
                  <option>CS502 - Operating Systems</option>
                </select>

                <!-- SEMESTER -->
                <select class="border rounded-lg p-2">
                  <option>Select Semester</option>
                  <option>MCA Sem 1</option>
                  <option>MCA Sem 2</option>
                </select>

                <!-- DATE -->
                <input type="date" class="border rounded-lg p-2" />
              </div>

              <button
                id="startAttendance"
                class="mt-4 bg-[#283618] text-white px-4 py-2 rounded-lg hover:bg-[#606c38]"
              >
                Take Attendance
              </button>
            </div>

            <!-- STUDENT LIST -->
            <div id="studentList" class="space-y-2"></div>

            <!-- ATTENDANCE SESSION PANEL -->
            <div
              id="attendanceSession"
              class="hidden bg-white p-6 rounded-2xl shadow-md text-center"
            >
              <h2 class="text-lg font-semibold text-gray-700 mb-4">
                Attendance Session Active
              </h2>

              <!-- PRESENT COUNT -->
              <div class="text-sm text-gray-500 mb-2">Students Present</div>

              <div class="text-3xl font-bold mb-6">
                <h2 id="presentCount">0 / 0</h2>
              </div>

              <!-- QR -->
              <div class="flex justify-center mb-6">
                <div
                  id="qrBox"
                  class="w-40 h-40 md:w-56 md:h-56 bg-gray-200 flex items-center justify-center rounded-lg"
                ></div>
              </div>

              <!-- TIMER -->
              <div class="text-gray-600 mb-4">
                Time Remaining:
                <span id="timer" class="font-semibold">20</span>s
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      feather.replace();
    </script>

    <script src="../js/layout.js"></script>
    <script src="../js/attendance_faculty.js"></script>
    <script src="../js/common.js"></script>

    <!-- ✅ OVERLAY -->
    <div
      id="overlay"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.1);
        display: none;
        z-index: 40;
      "
    ></div>
  </body>
</html>
