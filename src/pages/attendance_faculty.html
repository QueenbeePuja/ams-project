<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/output.css" />
    <script src="https://unpkg.com/feather-icons"></script>
    <title>ATTENDANCE</title>
  </head>

  <body>
    <div class="main-page flex h-screen">
      <div id="sidebar"></div>

      <div class="right-page flex flex-col flex-1 h-full">
        <div id="navbar"></div>
        <!-- Main body content where all the backend work will appear -->
        <div class="main-body-content flex-1 bg-[#fefae0] p-10 overflow-y-auto">
          <div class="grid gap-6 max-w-4xl mx-auto">
            <!-- ATTENDANCE SETUP -->
            <div class="bg-white p-6 rounded-2xl shadow-md">
              <h2 class="text-lg font-semibold text-gray-700 mb-4">
                Start Attendance
              </h2>

              <div class="grid grid-cols-3 gap-4">
                <!-- COURSE -->
                <select class="border rounded-lg p-2">
                  <option>Select Course</option>
                  <option>CS501 - Data Mining</option>
                  <option>CS502 - Operating Systems</option>
                </select>

                <!-- SEMESTER -->
                <select class="border rounded-lg p-2">
                  <option>Select Semester</option>
                  <option>MCA Sem 1</option>
                  <option>MCA Sem 2</option>
                </select>

                <!-- DATE -->
                <input type="date" class="border rounded-lg p-2" />
              </div>

              <button
                id="startAttendance"
                class="mt-4 bg-[#283618] text-white px-4 py-2 rounded-lg hover:bg-[#606c38]"
              >
                Take Attendance
              </button>
            </div>

            <!-- ATTENDANCE SESSION PANEL -->
            <div
              id="attendanceSession"
              class="hidden bg-white p-6 rounded-2xl shadow-md text-center"
            >
              <h2 class="text-lg font-semibold text-gray-700 mb-4">
                Attendance Session Active
              </h2>

              <!-- PRESENT COUNT -->
              <div class="text-sm text-gray-500 mb-2">Students Present</div>

              <div id="presentCount" class="text-3xl font-bold mb-6">
                0 / 52
              </div>

              <!-- QR PLACEHOLDER -->
              <div class="flex justify-center mb-6">
                <div
                  id="qrBox"
                  class="w-56 h-56 bg-gray-200 flex items-center justify-center rounded-lg"
                >
                  QR CODE
                </div>
              </div>

              <!-- COUNTDOWN -->
              <div class="text-gray-600 mb-4">
                Time Remaining:
                <span id="timer" class="font-semibold">20</span>s
              </div>

              <!-- GENERATE QR -->
              <button
                id="generateQR"
                class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700"
              >
                Generate QR
              </button>
            </div>
          </div>
        </div>
        <!--end of ADMIN cards -->
      </div>
    </div>
    <script>
      feather.replace();
    </script>
    <script src="../js/layout.js"></script>
    <script src="../js/attendance_faculty.js"></script>
    <script src="/src/js/common.js"></script>
  </body>
</html>
