<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/output.css" />
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <title>ATTENDANCE</title>
  </head>

  <body class="m-0 bg-[#fefae0]">
    <div class="flex flex-col min-h-screen">
      <div id="navbar"></div>

      <div class="flex flex-1 relative">
        <div id="sidebar"></div>

        <div class="main-body-content flex-1 bg-[#fefae0] p-4 overflow-y-auto">
          <div class="flex flex-col gap-6 max-w-4xl mx-auto">
            <!-- SETUP -->
            <div class="bg-white p-6 rounded-2xl shadow-md">
              <h2 class="text-lg font-semibold text-gray-700 mb-4">
                Start Attendance
              </h2>

              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <select id="subjectSelect" class="border rounded-lg p-2">
                  <option>Loading your subjects...</option>
                </select>
                <div
                  id="semesterText"
                  class="border rounded-lg p-2 bg-gray-50 text-gray-700"
                >
                  -
                </div>
                <input
                  id="sessionDate"
                  type="date"
                  class="border rounded-lg p-2 bg-gray-50"
                  disabled
                />
              </div>

              <button
                id="startAttendance"
                class="mt-4 bg-[#283618] text-white px-4 py-2 rounded-lg hover:bg-[#606c38]"
              >
                Take Attendance
              </button>
            </div>

            <!-- SESSION: QR FIRST -->
            <div
              id="attendanceSession"
              class="hidden bg-white p-6 rounded-2xl shadow-md text-center"
            >
              <h2 class="text-lg font-semibold text-gray-700 mb-4">
                Attendance Session Active
              </h2>

              <div class="text-sm text-gray-500 mb-2">Students Present</div>
              <div class="text-3xl font-bold mb-6">
                <h2 id="presentCount">0 / 0</h2>
              </div>

              <div class="flex justify-center mb-6">
                <div
                  id="qrBox"
                  class="w-40 h-40 md:w-56 md:h-56 bg-gray-200 flex items-center justify-center rounded-lg"
                ></div>
              </div>

              <div class="text-gray-600 mb-4">
                Time Remaining:
                <span id="timer" class="font-semibold">120</span>s
              </div>

              <button
                id="endAttendance"
                class="bg-red-700 text-white px-4 py-2 rounded-lg hover:bg-red-800"
              >
                End session now
              </button>
            </div>

            <!-- YET TO CHECK IN (below the QR, shrinks as students scan) -->
            <div
              id="pendingCard"
              class="hidden bg-white p-6 rounded-2xl shadow-md"
            >
              <h2
                id="pendingTitle"
                class="text-lg font-semibold text-gray-700 mb-3"
              >
                Yet to check in
              </h2>
              <div id="pendingList" class="max-h-96 overflow-y-auto"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      feather.replace();
    </script>

    <script src="../js/layout.js"></script>
    <script src="../js/attendance_faculty.js"></script>
    <script src="../js/common.js"></script>

    <div
      id="overlay"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.1);
        display: none;
        z-index: 40;
      "
    ></div>
  </body>
</html>
