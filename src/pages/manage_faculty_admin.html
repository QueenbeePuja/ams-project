<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/output.css" />
    <script src="https://unpkg.com/feather-icons"></script>
    <title>Manage Faculty</title>
  </head>

  <body class="m-0 bg-[#fefae0]">
    <div class="flex flex-col min-h-screen">
      <!-- NAVBAR -->
      <div id="navbar"></div>

      <!-- SIDEBAR + CONTENT -->
      <div class="flex flex-1 relative">
        <!-- SIDEBAR -->
        <div id="sidebar"></div>

        <!-- MAIN CONTENT -->
        <div class="main-body-content flex-1 bg-[#fefae0] p-4 overflow-y-auto">
          <div class="flex flex-col gap-6">
            <!-- MANAGE FACULTY -->
            <div class="bg-white p-6 rounded-2xl shadow-md">
              <div
                class="flex flex-col md:flex-row md:justify-between md:items-center gap-3"
              >
                <h2 class="text-xl font-semibold text-gray-700">
                  Manage Faculty
                </h2>

                <button
                  onclick="toggleFacultyForm()"
                  class="bg-[#283618] text-white px-4 py-2 rounded-lg hover:bg-[#606c38]"
                >
                  Add Faculty
                </button>
              </div>

              <!-- FORM -->
              <div id="facultyForm" class="hidden mt-6">
                <h3 class="text-lg font-semibold text-gray-700 mb-4">
                  Add Faculty
                </h3>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label class="text-sm text-gray-600">Faculty Name</label>
                    <input
                      id="facultyName"
                      type="text"
                      class="border rounded-lg p-2 w-full"
                    />
                  </div>

                  <div>
                    <label class="text-sm text-gray-600">Faculty ID</label>
                    <input
                      id="facultyId"
                      type="text"
                      class="border rounded-lg p-2 w-full"
                    />
                  </div>

                  <div>
                    <label class="text-sm text-gray-600">Email</label>
                    <input
                      id="facultyEmail"
                      type="email"
                      class="border rounded-lg p-2 w-full"
                    />
                  </div>

                  <div>
                    <label class="text-sm text-gray-600">Department</label>
                    <select
                      id="facultyDept"
                      class="border rounded-lg p-2 w-full"
                    >
                      <option>MCA</option>
                    </select>
                  </div>
                </div>

                <button
                  onclick="addFaculty()"
                  class="mt-4 bg-[#283618] text-white px-4 py-2 rounded-lg hover:bg-[#606c38]"
                >
                  Add Faculty
                </button>
              </div>
            </div>

            <!-- SEARCH + FILTER -->
            <div class="bg-white p-6 rounded-2xl shadow-md">
              <div class="flex flex-col md:flex-row gap-4 md:justify-between">
                <input
                  type="text"
                  placeholder="Search faculty..."
                  class="border rounded-lg p-2 w-full md:w-80"
                />

                <select class="border rounded-lg p-2 w-full md:w-auto">
                  <option>All Departments</option>
                  <option>Computer Applications</option>
                </select>
              </div>
            </div>

            <!-- FACULTY TABLE -->
            <div class="bg-white p-6 rounded-2xl shadow-md overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b text-gray-600 text-sm">
                    <th class="py-3">Faculty ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Actions</th>
                  </tr>
                </thead>

                <tbody id="facultyTableBody" class="text-gray-700"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      feather.replace();
    </script>

    <script src="../js/layout.js"></script>
    <script src="../js/manage_faculty_admin.js"></script>
    <script src="../js/common.js"></script>

    <!-- OVERLAY -->
    <div
      id="overlay"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.1);
        display: none;
        z-index: 40;
      "
    ></div>
  </body>
</html>
